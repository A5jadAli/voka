project_id = "voka"

[auth]
enable_anonymous_sign_ins = true
additional_redirect_urls = ["voka://auth?mode=confirmed", "voka://auth?mode=reset"]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[functions.realtime-session]
verify_jwt = true

[functions.writing-feedback]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.voice-cleanup]
verify_jwt = false

[functions.subscription-status]
verify_jwt = true

# RevenueCat uses its own authorization header and signed body, not a Supabase JWT.
[functions.revenuecat-webhook]
verify_jwt = false
