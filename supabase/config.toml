project_id = "voka"

[auth]
enable_anonymous_sign_ins = true
additional_redirect_urls = ["voka://auth?mode=confirmed", "voka://auth?mode=reset", "voka://oauth-callback"]
# Lets a guest attach Google to their existing account, so their progress is kept.
enable_manual_linking = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[functions.realtime-session]
verify_jwt = true

[functions.writing-feedback]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.voice-cleanup]
verify_jwt = false

[functions.subscription-status]
verify_jwt = true

# RevenueCat uses its own authorization header and signed body, not a Supabase JWT.
[functions.revenuecat-webhook]
verify_jwt = false

# "Continue with Google". The secret is never stored here: set
# SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET in the shell when running `supabase config push`.
[auth.external.google]
enabled = true
client_id = "616236826382-4nj0kfstp8vpaliab65ulehg984v6h6e.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Branded emails (supabase/templates). Supabase rejects template changes on the free plan
# until custom SMTP is configured, so uncomment these after setting up SMTP, then run
# `supabase config push`.
# [auth.email.template.confirmation]
# subject = "Confirm your email for Vokeno"
# content_path = "./supabase/templates/confirmation.html"

