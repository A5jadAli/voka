name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Audit high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Deno for Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check deployed Edge Functions
        run: |
          deno check --frozen --config supabase/functions/realtime-session/deno.json supabase/functions/realtime-session/index.ts
          deno check --frozen --config supabase/functions/voice-cleanup/deno.json supabase/functions/voice-cleanup/index.ts
          deno check --frozen --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts

  end-to-end:
    name: Mobile web flows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test compact and modern phone flows
        run: npm run test:e2e
